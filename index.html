<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Flappy Kiro</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The canvas is sized in device pixels by the shell (9:16 letterboxed). */
      #game-canvas {
        display: block;
        image-rendering: pixelated;
        background: #4ec0ca;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="360" height="640"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
